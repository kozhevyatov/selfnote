# SelfNote + SQLite — самый простой вариант: один контейнер, база — файл в ./data.
# Запуск: docker compose up -d → http://адрес-сервера:1339 → в мастере выбрать «SQLite».
services:
  selfnote:
    image: ghcr.io/kozhevyatov/selfnote:${SELFNOTE_TAG:-latest}
    container_name: selfnote
    restart: unless-stopped
    ports:
      - '${PORT:-1339}:1339'
    environment:
      NODE_ENV: production
      PORT: 1339
      DATA_DIR: /data
      COOKIE_SECURE: '${COOKIE_SECURE:-false}'
      TRUST_PROXY: '${TRUST_PROXY:-false}'
      APP_ORIGIN: '${APP_ORIGIN:-}'
      PUID: '${PUID:-}'
      PGID: '${PGID:-}'
      TZ: '${TZ:-UTC}'
      BACKUP_ENABLED: '${BACKUP_ENABLED:-true}'
      BACKUP_HOUR: '${BACKUP_HOUR:-4}'
      BACKUP_DIR: '${BACKUP_DIR:-/data/backups}'
    volumes:
      - ./data:/data
    stop_grace_period: 30s
